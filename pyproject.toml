[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptforge"
version = "0.1.0"
description = "Deterministic compiler from human intent to coding-agent handoffs"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
mvp = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
promptforge = "promptforge.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "mvp/tests"]
